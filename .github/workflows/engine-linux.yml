# Builds the engine patches on GitHub's Linux runner and runs their tests:
# the engine's own unit tests (Impeller on OpenGL ES, the Vulkan mock), the
# exported C functions of libflutter_linux_gtk.so and flutter_tester, and
# Reelx's engine tests and gated export suite on the built engine (Skia and
# Impeller). Runs on pushes to engine-perf/*-wip that touch the engine, and
# by hand.
name: Engine (Linux)

on:
  push:
    branches: ['engine-perf/*-wip']
    paths:
      - 'engine/src/flutter/**'
      - 'DEPS'
      - '.github/workflows/engine-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.repository != 'flutter/flutter'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      FLUTTER_VERSION: '3.47.9'
      ROOT: ${{ github.workspace }}/w
      OUT: ${{ github.workspace }}/w/flutter/engine/src/out/host_debug_unopt
    steps:
      - name: Free disk space
        run: |
          df -h /
          # Toolchains this job never uses (about 30 GB).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgtk-3-dev > /dev/null

      - name: Checkout (shallow)
        run: |
          mkdir -p "$ROOT"
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" "$ROOT/flutter"
          git -C "$ROOT/flutter" log --oneline -1

      - name: depot_tools
        run: |
          git clone --quiet --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$ROOT/depot_tools"
          echo "$ROOT/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync
        working-directory: ${{ env.ROOT }}/flutter
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "custom_deps": {},
              "deps_file": "DEPS",
              "managed": False,
              "name": ".",
              "safesync_url": "",
              "url": "https://github.com/flutter/flutter.git",
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_jdk": False,
                "download_esbuild": False,
              },
            },
          ]
          EOF
          gclient sync -D --no-history --shallow
          df -h /

      - name: Build (host_debug_unopt)
        id: build
        working-directory: ${{ env.ROOT }}/flutter
        run: |
          python3 engine/src/flutter/tools/gn --unoptimized --no-rbe --no-goma
          start=$(date +%s)
          third_party/ninja/ninja -C engine/src/out/host_debug_unopt \
            flutter/shell/testing:testing \
            flutter/shell/platform/linux:flutter_linux_gtk \
            flutter/lib/ui:ui_unittests \
            flutter/impeller:impeller_unittests
          echo "build took $(( ($(date +%s) - start) / 60 )) min"
          # flutter_tools wants a dart-sdk next to a local engine.
          ln -sfn ../../flutter/prebuilts/linux-x64/dart-sdk "$OUT/dart-sdk"
          df -h /

      - name: Exported C functions
        if: steps.build.outcome == 'success'
        run: |
          want="ReelxEngineInfo ReelxSetFeature ReelxImageReadbackToFd ReelxRepeatLastToFd ReelxReleaseFd ReelxRegisterShaderBytes ReelxUnregisterShaderBytes"
          failed=0
          for bin in "$OUT/flutter_tester" "$OUT/libflutter_linux_gtk.so"; do
            have=$(nm -D --defined-only "$bin" | awk '{print $3}' | grep '^Reelx' | sort | tr '\n' ' ')
            echo "$(basename "$bin"): $have"
            for f in $want; do
              case " $have " in *" $f "*) ;; *) echo "::error::$(basename "$bin") does not export $f"; failed=1 ;; esac
            done
          done
          exit $failed

      - name: Engine unit tests
        if: steps.build.outcome == 'success'
        run: |
          "$OUT/ui_unittests" --gtest_filter='Reelx*:ImageEncodingReelx*'
          # Impeller: OpenGL ES playgrounds (Vulkan can't start on this
          # runner), the Vulkan mock and the GLES texture tests.
          xvfb-run -a "$OUT/impeller_unittests" \
            --gtest_filter='*Reelx*OpenGLES*:EntityTest.YUV*OpenGLES*:RenderPassVK.*:TextureGLESTest.*'

      # Paused: Reelx is a private repository, and checking it out here needs
      # the owner's decision on a token. The engine's own tests above cover
      # the patches; Reelx's tests on the built engine run elsewhere for now.
      - name: Flutter ${{ env.FLUTTER_VERSION }} and Reelx
        if: false
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$ROOT/sdk"
          git clone --quiet --depth 1 https://github.com/reelx-dev/reelx.git "$ROOT/reelx"
          echo "$ROOT/sdk/bin" >> "$GITHUB_PATH"

      - name: Reelx tests on the built engine
        if: false
        run: |
          engine=(--local-engine-src-path="$ROOT/flutter/engine/src" --local-engine=host_debug_unopt --local-engine-host=host_debug_unopt)
          flutter --version
          failed=0
          # Without the engine's functions the Reelx tests take their
          # stock-engine branch and pass, so first check they are found.
          cat > "$ROOT/reelx/packages/reelx/test/built_engine_test.dart" <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:reelx/reelx.dart';
          void main() {
            test('ShaderBytes finds the built engine', () {
              expect(ShaderBytes.isSupported, isTrue);
            });
          }
          EOF
          cat > "$ROOT/reelx/packages/reelx_export/test/built_engine_test.dart" <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:reelx_export/reelx_export.dart';
          void main() {
            test('the engine reports itself with its Linux features', () {
              final info = ReelxEngine.current.info;
              expect(info.isStock, isFalse);
              expect(info.has('oneCopyReadback'), isTrue);
              expect(info.has('fdHandoff'), isTrue);
            });
          }
          EOF
          cd "$ROOT/reelx/packages/reelx"
          flutter pub get > /dev/null
          flutter test "${engine[@]}" test/built_engine_test.dart test/shaders || failed=1
          flutter test "${engine[@]}" --enable-impeller test/shaders || failed=1
          cd "$ROOT/reelx/packages/reelx_export"
          flutter pub get > /dev/null
          flutter test "${engine[@]}" test/built_engine_test.dart test/engine || failed=1
          # The gated export suite on the built engine, Skia then Impeller.
          flutter test "${engine[@]}" --dart-define=REELX_RUN_EXPORT_TESTS=true || failed=1
          flutter test "${engine[@]}" --enable-impeller --dart-define=REELX_RUN_EXPORT_TESTS=true || failed=1
          exit $failed
