# Builds the engine patches on GitHub's Windows runner and runs their tests:
# the engine's own unit tests, the exported C functions of flutter_windows.dll
# and flutter_tester.exe, and Reelx's engine tests on the built engine.
# Runs on pushes to engine-perf/*-wip that touch the engine, and by hand.
name: Engine (Windows)

on:
  push:
    branches: ['engine-perf/*-wip']
    paths:
      - 'engine/src/flutter/**'
      - 'DEPS'
      - '.github/workflows/engine-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository != 'flutter/flutter'
    runs-on: windows-latest
    timeout-minutes: 355
    defaults:
      run:
        shell: pwsh
    env:
      # Build with the runner's Visual Studio, not Google's packaged one.
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      FLUTTER_VERSION: '3.47.9'
    steps:
      - name: Work folder on the largest drive
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB)}}
          $drive = Get-PSDrive -PSProvider FileSystem | Sort-Object Free -Descending | Select-Object -First 1
          $root = "$($drive.Name):\w"
          New-Item -ItemType Directory -Force $root | Out-Null
          "ROOT=$root" >> $env:GITHUB_ENV
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "GYP_MSVS_OVERRIDE_PATH=$vs" >> $env:GITHUB_ENV
          "vs2022_install=$vs" >> $env:GITHUB_ENV
          Write-Host "work folder $root on $($drive.Name): ($([math]::Round($drive.Free/1GB)) GB free), Visual Studio $vs"

      - name: Checkout (shallow)
        run: |
          git config --global core.longpaths true
          git clone --quiet --depth 1 --branch "$env:GITHUB_REF_NAME" "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:ROOT\flutter"
          git -C "$env:ROOT\flutter" log --oneline -1

      - name: depot_tools
        run: |
          git clone --quiet --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:ROOT\depot_tools"
          "$env:ROOT\depot_tools" >> $env:GITHUB_PATH

      - name: gclient sync
        working-directory: ${{ env.ROOT }}\flutter
        run: |
          @'
          solutions = [
            {
              "custom_deps": {},
              "deps_file": "DEPS",
              "managed": False,
              "name": ".",
              "safesync_url": "",
              "url": "https://github.com/flutter/flutter.git",
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_jdk": False,
                "download_esbuild": False,
              },
            },
          ]
          '@ | Set-Content -Encoding ascii .gclient
          gclient sync -D --no-history --shallow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB)}}

      - name: Build (host_debug_unopt)
        working-directory: ${{ env.ROOT }}\flutter
        run: |
          python engine\src\flutter\tools\gn --unoptimized --no-rbe --no-goma
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $start = Get-Date
          third_party\ninja\ninja.exe -C engine\src\out\host_debug_unopt `
            flutter/shell/platform/windows:flutter_windows `
            flutter/shell/testing:testing `
            flutter/lib/ui:ui_unittests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "build took $([math]::Round(((Get-Date) - $start).TotalMinutes)) min"
          # flutter_tools wants a dart-sdk next to a local engine.
          New-Item -ItemType Junction -Path engine\src\out\host_debug_unopt\dart-sdk `
            -Target engine\src\flutter\prebuilts\windows-x64\dart-sdk | Out-Null

      - name: Exported C functions
        working-directory: ${{ env.ROOT }}\flutter\engine\src
        run: |
          $readobj = "flutter\buildtools\windows-x64\clang\bin\llvm-readobj.exe"
          $want = 'ReelxEngineInfo','ReelxSetFeature','ReelxImageReadbackToFd','ReelxRepeatLastToFd',
                  'ReelxReleaseFd','ReelxRegisterShaderBytes','ReelxUnregisterShaderBytes'
          $failed = $false
          foreach ($bin in 'out\host_debug_unopt\flutter_windows.dll', 'out\host_debug_unopt\flutter_tester.exe') {
            $exports = & $readobj --coff-exports $bin | Select-String 'Name: (Reelx\w+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            $missing = $want | Where-Object { $exports -notcontains $_ }
            Write-Host "$bin exports: $($exports -join ', ')"
            if ($missing) { Write-Host "::error::$bin is missing $($missing -join ', ')"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Engine unit tests
        working-directory: ${{ env.ROOT }}\flutter\engine\src
        run: |
          out\host_debug_unopt\ui_unittests.exe --gtest_filter="Reelx*:ImageEncodingReelx*"
          exit $LASTEXITCODE

      - name: Flutter ${{ env.FLUTTER_VERSION }} and Reelx
        run: |
          git clone --quiet --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:ROOT\sdk"
          git clone --quiet --depth 1 https://github.com/reelx-dev/reelx.git "$env:ROOT\reelx"
          "$env:ROOT\sdk\bin" >> $env:GITHUB_PATH

      - name: Reelx tests on the built engine
        run: |
          $engine = "--local-engine-src-path=$env:ROOT\flutter\engine\src", '--local-engine=host_debug_unopt', '--local-engine-host=host_debug_unopt'
          flutter --version
          $failed = $false
          # Without the engine's functions the Reelx tests below take their
          # stock-engine branch and pass, so first check they are found.
          @'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:reelx/reelx.dart';
          void main() {
            test('ShaderBytes finds the built engine', () {
              expect(ShaderBytes.isSupported, isTrue);
            });
          }
          '@ | Set-Content "$env:ROOT\reelx\packages\reelx\test\built_engine_test.dart"
          @'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:reelx_export/reelx_export.dart';
          void main() {
            test('the engine reports itself; no fd hand-off on Windows', () {
              final info = ReelxEngine.current.info;
              expect(info.isStock, isFalse);
              expect(info.has('fdHandoff'), isFalse);
              expect(info.has('oneCopyReadback'), isTrue);
            });
          }
          '@ | Set-Content "$env:ROOT\reelx\packages\reelx_export\test\built_engine_test.dart"
          Push-Location "$env:ROOT\reelx\packages\reelx"
          flutter pub get | Out-Null
          flutter test @engine test\built_engine_test.dart
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          # ShaderBytes must load a shader from bytes and draw with it.
          flutter test @engine test\shaders\shader_bytes_test.dart
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          Pop-Location
          Push-Location "$env:ROOT\reelx\packages\reelx_export"
          flutter pub get | Out-Null
          flutter test @engine test\built_engine_test.dart
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          flutter test @engine test\engine\engine_extensions_test.dart
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          Pop-Location
          if ($failed) { exit 1 }
